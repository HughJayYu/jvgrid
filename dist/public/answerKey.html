<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Key</title>
    <style>
        .playerA { background-color: red; }
        .playerB { background-color: blue; }
    </style>
</head>
<body>
    <div id="answerKeyContainer">
        <!-- Data will be populated here -->
    </div>

    <script>
        // Example data: a 3x3 array of player classes
        const data = [
            ['playerA', 'playerB', 'playerA'],
            ['playerB', 'playerA', 'playerB'],
            ['playerA', 'playerB', 'playerA']
        ];

        // Function to populate the HTML with data
        const populateAnswerKey = () => {
            const answerKeyContainer = document.getElementById('answerKeyContainer');

            // Loop through the 3x3 array and create elements for each player class
            for (let i = 0; i < data.length; i++) {
                const row = document.createElement('div');
                row.className = 'row';

                for (let j = 0; j < data[i].length; j++) {
                    const playerClass = data[i][j];
                    const playerElement = document.createElement('div');
                    playerElement.className = playerClass;
                    row.appendChild(playerElement);
                }

                answerKeyContainer.appendChild(row);
            }
        };

        // Call the function to populate the answer key
        populateAnswerKey();
    </script>
</body>
</html>
